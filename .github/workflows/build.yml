name: Build

on: 
  push:
    branches:
      - main
      - canon
    tags:
      - v*
  pull_request:
  workflow_dispatch:

env:
  OBS_VERSION: "33.0.0"

permissions: {}  # No permissions by default

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify OBS headers
        shell: bash
        run: |
          git -C third_party/obs-studio fetch --depth 1 origin "refs/tags/${OBS_VERSION}:refs/tags/${OBS_VERSION}"
          test "$(git -C third_party/obs-studio rev-parse HEAD)" = "$(git -C third_party/obs-studio rev-parse "refs/tags/${OBS_VERSION}^{commit}")"
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        run: |
          curl --fail --location --output obs-studio.deb "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/OBS-Studio-${OBS_VERSION}-Ubuntu-26.04-x86_64.deb"
          sudo apt update
          sudo apt install -y libsimde-dev ./obs-studio.deb
          installed_version=$(dpkg-query -W -f='${Version}' obs-studio)
          [[ "$installed_version" == "$OBS_VERSION"* ]] || { echo "Expected OBS $OBS_VERSION, got $installed_version"; exit 1; }
      - name: Build
        run: |
          libobs_path=$(dpkg-query -L obs-studio | awk '/\/libobs\.so$/ { print; exit }')
          test -n "$libobs_path" && test -f "$libobs_path"
          cp -L "$libobs_path" ./libobs.so
          go build -buildmode=c-shared -o obs-studio-exporter.so
          readelf -d obs-studio-exporter.so | grep -E 'Shared library: \[libobs\.so(\.[0-9]+)*\]'
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-linux
          path: obs-studio-exporter.so
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify OBS headers
        shell: bash
        run: |
          git -C third_party/obs-studio fetch --depth 1 origin "refs/tags/${OBS_VERSION}:refs/tags/${OBS_VERSION}"
          test "$(git -C third_party/obs-studio rev-parse HEAD)" = "$(git -C third_party/obs-studio rev-parse "refs/tags/${OBS_VERSION}^{commit}")"
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64-Installer.exe" -OutFile obs-studio-installer.exe
          $installer = Start-Process -FilePath .\obs-studio-installer.exe -ArgumentList /S -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "OBS installer failed: $($installer.ExitCode)" }
      - name: Build
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\obs-studio\bin\64bit\obs.dll" -Destination "."
          go build -buildmode=c-shared -o obs-studio-exporter.dll
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-windows
          path: obs-studio-exporter.dll
          if-no-files-found: error

  build-macos:
    name: macOS ARM64
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify OBS headers
        shell: bash
        run: |
          git -C third_party/obs-studio fetch --depth 1 origin "refs/tags/${OBS_VERSION}:refs/tags/${OBS_VERSION}"
          test "$(git -C third_party/obs-studio rev-parse HEAD)" = "$(git -C third_party/obs-studio rev-parse "refs/tags/${OBS_VERSION}^{commit}")"
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        run: |
          brew install simde
          curl --fail --location -o obs-macos-arm64.dmg "https://github.com/obsproject/obs-studio/releases/download/${{ env.OBS_VERSION }}/OBS-Studio-${{ env.OBS_VERSION }}-macOS-Apple.dmg"
          hdiutil attach "./obs-macos-arm64.dmg"
      - name: Build
        run: |
          cp -R /Volumes/OBS*/OBS.app/Contents/Frameworks/libobs.framework ./libobs.framework
          export CGO_CFLAGS="-I$(brew --prefix simde)/include"
          go build -buildmode=c-shared -o obs-studio-exporter.so -ldflags="-extldflags=-F$PWD"
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-macos-arm64
          path: obs-studio-exporter.so
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canon' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false  # Just need the repo, we're not doing any building here
          persist-credentials: false
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-linux
          path: dist/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-windows
          path: dist/windows
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-macos-arm64
          path: dist/macos-arm64
      - name: Package artifacts
        run: |
          mkdir -p release
          cp dist/linux/obs-studio-exporter.so release/obs-studio-exporter-linux.so
          cp dist/windows/obs-studio-exporter.dll release/obs-studio-exporter-windows.dll
          cp dist/macos-arm64/obs-studio-exporter.so release/obs-studio-exporter-macos-arm64.so
      - name: Publish OBS version prerelease
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canon'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${OBS_VERSION}-build.${GITHUB_RUN_NUMBER}" --target "$GITHUB_SHA" --title "OBS ${OBS_VERSION} — build ${GITHUB_RUN_NUMBER}" --generate-notes --prerelease release/*
      - name: Publish Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" == "v${OBS_VERSION}" || "$GITHUB_REF_NAME" == "v${OBS_VERSION}-"* ]] || { echo "Release tag must match OBS ${OBS_VERSION}"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" --title "OBS ${OBS_VERSION} (${GITHUB_REF_NAME})" --generate-notes --draft release/*
