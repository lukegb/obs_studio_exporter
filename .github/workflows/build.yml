name: Build

on: 
  push:
    branches:
      - canon
    tags:
      - v*
  pull_request:
  workflow_dispatch:

env:
  OBS_VERSION: "32.2.2"

permissions: {}  # No permissions by default

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        run: |
          sudo add-apt-repository ppa:obsproject/obs-studio
          sudo apt update
          sudo apt install -y libsimde-dev obs-studio
      - name: Build
        run: |
          cp /lib/x86_64-linux-gnu/libobs.so.0 ./libobs.so
          go build -buildmode=c-shared -o obs-studio-exporter.so
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-linux
          path: obs-studio-exporter.so
          if-no-files-found: error

  build-windows:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-Windows-x64-Installer.exe" -OutFile obs-studio-installer.exe
          .\obs-studio-installer.exe /S | Out-Null
      - name: Build
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\obs-studio\bin\64bit\obs.dll" -Destination "."
          go build -buildmode=c-shared -o obs-studio-exporter.dll
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-windows
          path: obs-studio-exporter.dll
          if-no-files-found: error

  build-macos:
    name: macOS ARM64
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Install OBS
        run: |
          brew install simde
          curl -L -o obs-macos-arm64.dmg "https://cdn-fastly.obsproject.com/downloads/OBS-Studio-${{ env.OBS_VERSION }}-macOS-Apple.dmg"
          hdiutil attach "./obs-macos-arm64.dmg"
      - name: Build
        run: |
          cp -R /Volumes/OBS*/OBS.app/Contents/Frameworks/libobs.framework ./libobs.framework
          export CGO_CFLAGS="-I$(brew --prefix simde)/include"
          go build -buildmode=c-shared -o obs-studio-exporter.so -ldflags="-extldflags=-F$PWD"
      - name: Archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: obs-studio-exporter-macos-arm64
          path: obs-studio-exporter.so
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - build-linux
      - build-windows
      - build-macos
    if: github.event_name == 'push' && (github.ref == 'refs/heads/canon' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false  # Just need the repo, we're not doing any building here
          persist-credentials: false
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-linux
          path: dist/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-windows
          path: dist/windows
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: obs-studio-exporter-macos-arm64
          path: dist/macos-arm64
      - name: Package artifacts
        run: |
          mkdir -p release
          cp dist/linux/obs-studio-exporter.so release/obs-studio-exporter-linux.so
          cp dist/windows/obs-studio-exporter.dll release/obs-studio-exporter-windows.dll
          cp dist/macos-arm64/obs-studio-exporter.so release/obs-studio-exporter-macos-arm64.so
      - name: Publish Nightly Release
        if: github.ref == 'refs/heads/canon'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "nightly-${{ github.run_number }}" --title "Nightly ${{ github.run_number }}" --generate-notes --prerelease release/*
      - name: Publish Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --draft release/*
